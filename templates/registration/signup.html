{% extends "base.html" %}
{% block title %}註冊{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4">建立帳號</h1>
        <form method="post">
          {% csrf_token %}
          {% include "form_fields.html" %}
          <button class="btn btn-primary w-100">註冊</button>
        </form>
        <p class="mt-3 mb-0 text-center small">已經有帳號？<a href="{% url 'login' %}">登入</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
