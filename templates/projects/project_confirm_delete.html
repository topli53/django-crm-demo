{% extends "base.html" %}
{% block title %}刪除案件{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-danger">
      <div class="card-body p-4">
        <h1 class="h5">確定要刪除「{{ object.title }}」嗎？</h1>
        <p class="text-muted">刪除後無法復原。</p>
        <form method="post" class="d-flex gap-2">
          {% csrf_token %}
          <button class="btn btn-danger">確定刪除</button>
          <a class="btn btn-outline-secondary" href="{% url 'project_list' %}">取消</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
