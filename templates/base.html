<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}接案管理{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'project_list' %}">接案管理</a>
      <div class="d-flex align-items-center gap-2">
        {% if user.is_authenticated %}
          <span class="text-light small">{{ user.username }}</span>
          {% if user.is_staff %}<a class="btn btn-sm btn-outline-light" href="{% url 'admin:index' %}">後台</a>{% endif %}
          <form method="post" action="{% url 'logout' %}" class="m-0">
            {% csrf_token %}
            <button class="btn btn-sm btn-outline-light">登出</button>
          </form>
        {% else %}
          <a class="btn btn-sm btn-outline-light" href="{% url 'login' %}">登入</a>
          <a class="btn btn-sm btn-light" href="{% url 'signup' %}">註冊</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container">
    {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
